[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hakiapi"
version = "2.1.6"
description = "A modern Python framework for building clean, typed, and extensible API clients."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

authors = [
    { name = "Gugilla Aakash" },
    { email = "gugillaaakash6@gmail.com" }
]

keywords = ["api-client", "retry", "pagination", "rest-api", "http"]

dependencies = [
    "requests>=2.32.0",
    "urllib3>=1.26.0"
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Typing :: Typed",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
]

[project.urls]
"Homepage" = "https://github.com/Gugilla-Aakash/hakiapi"
"Source Code" = "https://github.com/Gugilla-Aakash/hakiapi"
"Bug Tracker" = "https://github.com/Gugilla-Aakash/hakiapi/issues"

[project.optional-dependencies]
async = [
    "httpx>=0.27.0",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "responses",
    "ruff",
    "mypy",
    "bandit[toml]",
    "pip-audit",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["hakiapi", "hakiapi.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --cov=hakiapi --cov-report=term-missing --cov-fail-under=85"
asyncio_mode = "strict"

[tool.coverage.run]
source = ["hakiapi"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
